data_path: 'dataset/norm/'
benchmark_filename: [train, valid, test]
alias_of_item_id: [item_id_list]
load_col:
  inter: [user_id, item_id_list, item_id]
neg_sampling: ~
transform: ~
# log_wandb: True
# wandb_project: 'LPRec'

train_stage: pretrain
communication_rounds: 5
epochs: 1        # local epochs = communication rounds * local epochs
train_batch_size: 512
learner: 'adamw'
learning_rate: 0.001
gpu_id: 0
seed: 67
max_seq_length : 50
checkpoint_dir : 'saveLPRec/experiments'

# Qwen3 P-Tuning Specific Settings
base_model_name: "Qwen/Qwen3-Embedding-0.6B"
num_virtual_tokens: 5
enable_amp: True
enable_scaler: False

topk: [10, 50]
metrics: [RECALL, NDCG]
valid_metric: RECALL@10
eval_step: 1
eval_batch_size: 1024
stopping_step: 100  # No early stopping

hidden_dropout_prob: 0.5
layer_norm_eps: 1e-12
initializer_range: 0.02
loss_type: 'CE'
train_neg_sample_args: ~
smoothing_factor: 0.5

plm_suffix: feat1LLM
plm_size: 1024
temperature: 0.07

n_exps: 8
adapter_layers: [1024,1024]
adapter_dropout_prob: 0.2

# LoRA Configuration
lora_r: 16
lora_alpha: 32
lora_dropout: 0.1
lora_target_modules: ["self_attn.q_proj","self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj", "mlp.up_proj", "mlp.down_proj"]

